<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Enquiry | MGN Travels Chennai</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800&family=Playfair+Display:wght@600;900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

    <style>
        :root {
            --gold-primary: #D4AF37;
            --gold-light: #F9E498;
            --accent-gradient: linear-gradient(135deg, #D4AF37 0%, #F9E498 100%);
            --bg-dark: #0a0a0a;
            --card-bg: #151515;
            --input-bg: #111111;
            --border-color: #222222;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: #ffffff;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .contact-container {
            width: 100%;
            max-width: 1100px;
            background-color: transparent;
            padding: 20px;
        }

        /* --- HEADER SECTION --- */
        .contact-header {
            margin-bottom: 50px;
            position: relative;
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .contact-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 2.8rem);
            font-weight: 900;
            white-space: nowrap;
            color: #ffffff;
        }

        .contact-header::after {
            content: '';
            flex-grow: 1;
            height: 1px;
            background: linear-gradient(to right, rgba(212, 175, 55, 0.4), transparent);
        }

        /* --- SPLIT GRID LAYOUT --- */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 60px;
            align-items: start;
        }

        /* --- INFO COLUMN --- */
        .info-column {
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .icon-box {
            width: 60px;
            height: 60px;
            background: rgba(212, 175, 55, 0.08);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            color: var(--gold-primary);
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .info-item:hover .icon-box {
            transform: scale(1.08);
            background: rgba(212, 175, 55, 0.15);
        }

        .info-text h4 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 4px;
        }

        .info-text p, .info-text a {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .info-text a:hover {
            color: var(--gold-primary);
        }

        /* --- FORM COLUMN --- */
        .form-column form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            position: relative;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 16px 20px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            resize: none;
            min-height: 120px;
        }

        /* Input Placeholders styling */
        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #555555;
            transition: color 0.3s ease;
        }

        /* Interactive Focus Effects */
        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.15);
            background-color: #151515;
        }

        .form-group input:focus::placeholder,
        .form-group textarea:focus::placeholder {
            color: #888888;
        }

        /* --- SUBMIT BUTTON --- */
        .submit-btn {
            background: var(--accent-gradient);
            color: #000000;
            border: none;
            padding: 18px;
            border-radius: 8px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.3);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* --- RESPONSIVE MEDIA QUERIES --- */
        @media (max-width: 868px) {
            body {
                padding: 60px 24px;
            }
            .contact-grid {
                grid-template-columns: 1fr;
                gap: 50px;
            }
            .contact-header {
                margin-bottom: 40px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
    </style>
</head>
<body>

    <div class="contact-container" data-aos="fade-up" data-aos-duration="1000">
        
        <div class="contact-header">
            <h2>Booking Enquiry</h2>
        </div>

        <div class="contact-grid">
            
            <div class="info-column">
                
                <div class="info-item">
                    <div class="icon-box">
                        <i class="bi bi-geo-alt"></i>
                    </div>
                    <div class="info-text">
                        <h4>Location:</h4>
                        <p>Chennai, Tamil Nadu, India</p>
                    </div>
                </div>

                <div class="info-item">
                    <div class="icon-box">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <div class="info-text">
                        <h4>Email:</h4>
                        <a href="mailto:mgntravels77@gmail.com">mgntravels77@gmail.com</a>
                    </div>
                </div>

                <div class="info-item">
                    <div class="icon-box">
                        <i class="bi bi-telephone"></i>
                    </div>
                    <div class="info-text">
                        <h4>Call / WhatsApp:</h4>
                        <a href="tel:+919941142648">+91 99411 42648</a>
                    </div>
                </div>

            </div>

            <div class="form-column">
                <form id="travelContactForm" novalidate>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="userName" placeholder="Your Name" required>
                        </div>
                        <div class="form-group">
                            <input type="tel" id="userPhone" placeholder="Phone Number" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <input type="email" id="userEmail" placeholder="Your Email" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="msgSubject" placeholder="Subject (e.g., Outstation Tour)" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <input type="text" id="pickLocation" placeholder="Pickup Location (e.g., Chennai Airport)" required>
                        </div>
                        <div class="form-group">
                            <input type="text" id="dropLocation" placeholder="Drop Location (e.g., Pondicherry)" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <textarea id="userMessage" placeholder="Additional Details (Date, Travel Time, Vehicle Preferences...)" required></textarea>
                    </div>

                    <button type="submit" class="submit-btn">Send Booking Request</button>
                    
                </form>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
    <script>
    // Initialize Scroll Animations
    AOS.init({ once: true });

    document.getElementById('travelContactForm').addEventListener('submit', function(event) {
        event.preventDefault();

        const name = document.getElementById('userName').value.trim();
        const phone = document.getElementById('userPhone').value.trim();
        const email = document.getElementById('userEmail').value.trim();
        const subject = document.getElementById('msgSubject').value.trim();
        const pickup = document.getElementById('pickLocation').value.trim();
        const drop = document.getElementById('dropLocation').value.trim();
        const message = document.getElementById('userMessage').value.trim();

        if (!name || !phone || !email || !subject || !pickup || !drop || !message) {
            alert("Please fill all fields.");
            return;
        }

        if (phone.length < 10) {
            alert("Please enter a valid phone number.");
            return;
        }

        // Your WhatsApp Number (without +, spaces, or dashes)
        const whatsappNumber = "919941142648";

        // Create WhatsApp message
        const whatsappMessage =
`*New Booking Enquiry*

*Name:* ${name}
*Phone:* ${phone}
*Email:* ${email}

*Subject:* ${subject}

*Pickup Location:* ${pickup}
*Drop Location:* ${drop}

*Additional Details:*
${message}`;

        // Open WhatsApp
        const whatsappURL =
            `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(whatsappMessage)}`;

        window.open(whatsappURL, "_blank");

        // Optional: Clear form
        this.reset();
    });
</script>
</body>
</html>
